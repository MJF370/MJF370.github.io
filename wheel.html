<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>生日幸运大抽奖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;user-select:none;-webkit-user-select:none;background:#000}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.screen.active{display:flex}
/* 屏1 */
#screen1{background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 30%,#fbc2eb 60%,#a18cd1 100%)}
.welcome-stage{text-align:center;color:#fff;position:relative;z-index:2;padding:0 30px}
.welcome-line1,.welcome-line2{display:block;font-weight:800;letter-spacing:2px;text-shadow:0 4px 20px rgba(0,0,0,0.3);opacity:0}
.welcome-line1{font-size:30px;margin-bottom:20px}
.welcome-line2{font-size:46px;background:linear-gradient(45deg,#fff200,#ff6b9d,#c780ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome-line1.show{animation:fadeInUp 1.2s ease-out forwards}
.welcome-line2.show{animation:fadeInScale 1.2s ease-out .8s forwards}
@keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.fireworks{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;animation:explode 1.5s ease-out forwards}
@keyframes explode{0%{transform:translate(0,0) scale(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}}
.next-btn{position:absolute;right:20px;bottom:30px;padding:12px 22px;background:rgba(255,255,255,.25);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10;opacity:0;transition:all .3s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.next-btn.show{opacity:1;animation:bounceIn .6s ease-out}
.next-btn:active{transform:scale(.95)}
@keyframes bounceIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.1)}100%{transform:scale(1)}}
/* 屏2 */
#screen2{background:linear-gradient(160deg,#ffecd2 0%,#fcb69f 100%);padding:30px 24px}
.rules-container{width:100%;max-width:380px;background:rgba(255,255,255,.92);border-radius:20px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.rules-title{font-size:22px;font-weight:800;color:#d63031;text-align:center;margin-bottom:20px}
.rules-list{list-style:none;counter-reset:rule}
.rules-list li{position:relative;padding:12px 0 12px 32px;font-size:15px;line-height:1.6;color:#2d3436;border-bottom:1px dashed rgba(214,48,49,.2);opacity:0;transform:translateX(-20px);transition:all .5s}
.rules-list li:last-child{border-bottom:none}
.rules-list li::before{content:counter(rule);counter-increment:rule;position:absolute;left:0;top:12px;width:22px;height:22px;background:#d63031;color:#fff;border-radius:50%;text-align:center;line-height:22px;font-size:13px;font-weight:bold}
.rules-list li.show{opacity:1;transform:translateX(0)}
/* 屏3 */
#screen3{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.wheel-wrapper{position:relative;width:320px;height:320px;margin:20px auto}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;box-shadow:0 0 30px rgba(255,255,255,.4),inset 0 0 20px rgba(0,0,0,.2);border:6px solid #fff;transition:transform 4s cubic-bezier(.17,.67,.21,.99)}
.wheel-pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:35px solid #ff4757;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#ff4757;box-shadow:0 4px 15px rgba(0,0,0,.3);cursor:pointer;z-index:4;transition:transform .2s;border:4px solid #ff4757;text-align:center;line-height:1.3}
.wheel-center:active{transform:translate(-50%,-50%) scale(.95)}
.wheel-center.disabled{background:#ccc;color:#fff;border-color:#999;cursor:not-allowed}
.prize-modal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.prize-modal.show{display:flex;animation:fadeIn .3s}
.prize-card{background:linear-gradient(135deg,#fff 0%,#fff5f5 100%);border-radius:24px;padding:30px 24px;text-align:center;max-width:320px;width:85%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);position:relative}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.prize-card h2{color:#ff4757;font-size:22px;margin-bottom:16px}
.prize-card .prize-img{width:160px;height:160px;margin:0 auto 16px;border-radius:16px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.prize-card .prize-img img{width:100%;height:100%;object-fit:cover}
.prize-card .prize-img .emoji{font-size:80px}
.prize-card .prize-name{font-size:20px;font-weight:700;color:#2d3436;margin-bottom:20px}
.prize-card .close-btn{padding:10px 28px;background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer}
.prize-card .close-btn:active{transform:scale(.95)}
.prize-card::before{content:"🎉";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:50px}
/* 屏4 */
#screen4{background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);flex-direction:column}
.cake-stage{position:relative;margin-top:30px}
.cake{width:180px;height:200px;position:relative;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cake-layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:20px}
.cake-layer-1{bottom:0;width:180px;height:60px;background:linear-gradient(180deg,#ffb6c1,#ff8fa3)}
.cake-layer-2{bottom:55px;width:140px;height:50px;background:linear-gradient(180deg,#fff5e1,#ffe4b5)}
.cake-layer-3{bottom:100px;width:100px;height:45px;background:linear-gradient(180deg,#d4a5ff,#b388eb)}
.candle{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:8px;height:30px;background:linear-gradient(180deg,#fff,#ffd700);border-radius:2px}
.flame{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:14px;height:22px;background:radial-gradient(ellipse at center bottom,#ffeb3b 0%,#ff9800 40%,#ff5722 70%,transparent 100%);border-radius:50% 50% 20% 20%;animation:flicker .3s ease-in-out infinite alternate;box-shadow:0 0 20px #ff9800,0 0 40px #ff5722}
@keyframes flicker{from{transform:translateX(-50%) scale(1) rotate(-2deg)}to{transform:translateX(-50%) scale(1.1) rotate(2deg)}}
.birthday-text{margin-top:50px;font-size:28px;font-weight:800;color:#fff;letter-spacing:4px;text-shadow:0 0 20px #ff6b9d,0 0 40px #c780ff;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 20px #ff6b9d,0 0 40px #c780ff}to{text-shadow:0 0 30px #ffeb3b,0 0 60px #ff6b9d,0 0 90px #c780ff}}
.birthday-subtitle{margin-top:16px;font-size:14px;color:rgba(255,255,255,.7);text-align:center;padding:0 20px}
.celebration{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
.celebration.show{display:block}
.confetti{position:absolute;width:10px;height:14px;top:-20px;animation:confettiFall 3s linear forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.cannon{position:absolute;bottom:20%;font-size:50px;animation:boom 1s ease-out forwards}
@keyframes boom{0%{transform:scale(0);opacity:1}50%{transform:scale(1.5);opacity:1}100%{transform:scale(2.2);opacity:0}}
.audio-tip{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:20;cursor:pointer;backdrop-filter:blur(10px)}
.error-tip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:20px 30px;border-radius:12px;font-size:15px;z-index:9999;max-width:80%;text-align:center;line-height:1.6}
/* ===== 樱桃小丸子主题 ===== */
.screen{background:linear-gradient(135deg,#ffd6e7 0%,#fff2b3 50%,#ffe0b2 100%)!important}
#screen4{background:linear-gradient(180deg,#ffd6e7 0%,#fff2b3 60%,#ffe0b2 100%)!important}
#screen4 .birthday-text{color:#d63031}
#screen4 .birthday-subtitle{color:#c44569}
.sakura{position:absolute;top:-30px;font-size:20px;pointer-events:none;z-index:1;animation:sakuraFall linear infinite}
@keyframes sakuraFall{
  0%{transform:translateY(-30px) translateX(0) rotate(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(110vh) translateX(40px) rotate(720deg);opacity:0}
}
.maruko{position:relative;display:inline-block;line-height:1}
.maruko-emoji{position:relative;display:inline-block}
.maruko-emoji::before{content:"🎀";position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:.5em;z-index:2}
.float-slow{animation:floatSlow 4s ease-in-out infinite}
.float-fast{animation:floatSlow 2.5s ease-in-out infinite}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.swing{animation:swing 3s ease-in-out infinite;transform-origin:top center}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.spin-orbit{position:absolute;width:100%;height:100%;top:0;left:0;animation:orbit 12s linear infinite;pointer-events:none;z-index:3}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orbit-emoji{position:absolute;font-size:26px;top:50%;left:50%;margin-top:-13px;margin-left:-13px;transform-origin:0 0}
.spin-orbit-inner{animation:orbit 8s linear infinite reverse}
.wheel-center-maruko{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:96px;height:96px;background:radial-gradient(circle at 50% 40%,#fff 0%,#ffe0e9 100%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:4;border:4px solid #ff6b9d;box-shadow:0 4px 20px rgba(255,107,157,.5),inset 0 -4px 8px rgba(255,107,157,.2);padding-top:6px}
.wheel-center-maruko:active{transform:translate(-50%,-50%) scale(.95)}
.wheel-center-maruko.disabled{background:linear-gradient(135deg,#ccc,#999);border-color:#999;cursor:not-allowed}
.wheel-center-maruko .spin-img{width:46px;height:46px;object-fit:contain;display:block}
.wheel-center-maruko .maruko-label{font-size:11px;font-weight:800;color:#ff4757;white-space:nowrap;line-height:1.1;margin-top:2px;text-align:center}
.wheel-center-maruko.disabled .maruko-label{color:#fff}
.welcome-maruko{position:relative;display:inline-block;margin-bottom:10px}
.welcome-maruko::before{content:"🎀";position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:.55em;z-index:2}
.cake-side{position:absolute;bottom:0;font-size:50px;animation:floatSlow 3s ease-in-out infinite}
.cake-side.left{left:10px;animation-delay:0s}
.cake-side.right{right:10px;animation-delay:1.5s}
.cake-side.bottom-l{left:30%;bottom:-10px;font-size:40px;animation-delay:.7s}
.cake-side.bottom-r{right:30%;bottom:-10px;font-size:40px;animation-delay:2.2s}
.title-decoration{position:absolute;font-size:30px;animation:floatSlow 3s ease-in-out infinite;z-index:2}
.title-decoration.tl{top:60px;left:20px;animation-delay:0s}
.title-decoration.tr{top:80px;right:20px;animation-delay:1.5s}
.title-decoration.bl{bottom:120px;left:30px;animation-delay:2s;font-size:24px}
.title-decoration.br{bottom:100px;right:30px;animation-delay:.5s;font-size:24px}
/* 樱桃小丸子角色贴纸 */
.sticker{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(255,107,157,.35),0 0 0 3px #fff,0 0 0 5px #ffd6e7;padding:4px;display:inline-block;vertical-align:middle}
.sticker img{display:block;width:100%;height:100%;object-fit:contain}
.sticker-xl{width:110px;height:110px}
.sticker-lg{width:80px;height:80px}
.sticker-md{width:60px;height:60px}
.sticker-sm{width:50px;height:50px}
.sticker-xs{width:40px;height:40px}
.welcome-maruko-img{width:130px;height:130px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(255,107,157,.45),0 0 0 6px #fff,0 0 0 10px #ffd6e7;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;animation:floatSlow 4s ease-in-out infinite}
.welcome-maruko-img img{width:108px;height:108px;object-fit:contain}
.wheel-center-maruko .sticker-sm{margin:0;border:0;box-shadow:none;background:transparent;padding:0;width:56px;height:56px}
.wheel-center-maruko .sticker-sm img{width:56px;height:56px}
.cake-side .sticker-md{margin:0;border-width:2px}
</style>
</head>
<body>
<div class="screen active" id="screen1">
  <div class="fireworks" id="fireworks"></div>
  <div class="sakura-layer" id="sakuraLayer1"></div>
  <span class="title-decoration tl float-slow"><img src="https://mjf370.github.io/m2_tamako.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration tr float-slow"><img src="https://mjf370.github.io/m1_maruko.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration bl float-fast"><img src="https://mjf370.github.io/m7_dog.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration br float-slow"><img src="https://mjf370.github.io/m6_mama.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <div class="welcome-stage">
    <div class="welcome-maruko-img">
      <img src="https://mjf370.github.io/m1_maruko.png" alt="小丸子">
    </div>
    <span class="welcome-line1" id="welcomeLine1"></span>
    <span class="welcome-line2" id="welcomeLine2">幸运大抽奖</span>
  </div>
  <button class="next-btn" id="btn1">下一张 →</button>
</div>
<div class="screen" id="screen2">
  <div class="sakura-layer" id="sakuraLayer2"></div>
  <span class="title-decoration tl float-slow"><img src="https://mjf370.github.io/m3_grandpa.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration tr float-slow"><img src="https://mjf370.github.io/m4_grandma.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration bl float-fast"><img src="https://mjf370.github.io/m2_tamako.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration br float-slow"><img src="https://mjf370.github.io/m7_dog.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <div class="rules-container">
    <h2 class="rules-title"><img src="https://mjf370.github.io/m1_maruko.png" style="width:42px;height:42px;vertical-align:middle;border-radius:12px;background:#fff;padding:2px;margin:0 4px"> 用户须知 <img src="https://mjf370.github.io/m2_tamako.png" style="width:42px;height:42px;vertical-align:middle;border-radius:12px;background:#fff;padding:2px;margin:0 4px"></h2>
    <ol class="rules-list">
      <li>该游戏轮盘，仅限于本人参加，其他人参加均为无效参与</li>
      <li>游戏轮盘奖励内容无法更改，如需调整，需联系开发者</li>
      <li>玩家本人仅有抽奖机会一次，如若本人第一次抽奖，抽中红包类型，则获得额外抽奖次数一次</li>
      <li>游戏内一切权利解释归开发者所有</li>
    </ol>
  </div>
  <button class="next-btn" id="btn2">下一张 →</button>
</div>
<div class="screen" id="screen3">
  <div class="sakura-layer" id="sakuraLayer3"></div>
  <span class="title-decoration tl float-slow"><img src="https://mjf370.github.io/m1_maruko.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration tr float-slow"><img src="https://mjf370.github.io/m2_tamako.png" style="width:50px;height:50px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration bl float-fast"><img src="https://mjf370.github.io/m7_dog.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <span class="title-decoration br float-slow"><img src="https://mjf370.github.io/m4_grandma.png" style="width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(255,107,157,.4)"></span>
  <div class="wheel-wrapper">
    <div class="spin-orbit">
      <span class="orbit-emoji" style="transform:rotate(0deg) translateX(180px) rotate(0deg)"><img src="https://mjf370.github.io/m1_maruko.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(60deg) translateX(180px) rotate(-60deg)"><img src="https://mjf370.github.io/m2_tamako.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(120deg) translateX(180px) rotate(-120deg)"><img src="https://mjf370.github.io/m7_dog.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(180deg) translateX(180px) rotate(-180deg)"><img src="https://mjf370.github.io/m3_grandpa.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(240deg) translateX(180px) rotate(-240deg)"><img src="https://mjf370.github.io/m4_grandma.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(300deg) translateX(180px) rotate(-300deg)"><img src="https://mjf370.github.io/m6_mama.png" style="width:46px;height:46px;border-radius:12px;background:#fff;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)"></span>
    </div>
    <div class="spin-orbit spin-orbit-inner">
      <span class="orbit-emoji" style="transform:rotate(30deg) translateX(150px) rotate(-30deg)"><img src="https://mjf370.github.io/m5_papa.png" style="width:34px;height:34px;border-radius:10px;background:#fff;padding:2px;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(150deg) translateX(150px) rotate(-150deg)"><img src="https://mjf370.github.io/m8_family.png" style="width:38px;height:34px;border-radius:10px;background:#fff;padding:2px;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span>
      <span class="orbit-emoji" style="transform:rotate(270deg) translateX(150px) rotate(-270deg)"><img src="https://mjf370.github.io/m1_maruko.png" style="width:34px;height:34px;border-radius:10px;background:#fff;padding:2px;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span>
    </div>
    <div class="wheel-pointer"></div>
    <canvas class="wheel" id="wheel" width="640" height="640"></canvas>
    <div class="wheel-center-maruko" id="spinBtn">
      <img class="spin-img" src="https://mjf370.github.io/m1_maruko.png" alt="小丸子">
      <span class="maruko-label" id="spinLabel">开始<br>抽奖</span>
    </div>
  </div>
  <button class="next-btn" id="btn3">领取祝福 →</button>
  <div class="prize-modal" id="prizeModal">
    <div class="prize-card">
      <h2 id="prizeTitle">恭喜你！</h2>
      <div class="prize-img" id="prizeImg"></div>
      <div class="prize-name" id="prizeName"></div>
      <button class="close-btn" id="closeModal">查看祝福</button>
    </div>
  </div>
</div>
<div class="screen" id="screen4">
  <div class="sakura-layer" id="sakuraLayer4"></div>
  <div class="audio-tip" id="audioTip" style="display:none">🔊 点击开启生日歌</div>
  <div class="cake-stage">
    <div class="cake">
      <div class="cake-layer cake-layer-1"></div>
      <div class="cake-layer cake-layer-2"></div>
      <div class="cake-layer cake-layer-3"></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <span class="cake-side left"><img src="https://mjf370.github.io/m1_maruko.png" style="width:60px;height:60px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 3px 8px rgba(0,0,0,.15)"></span>
    <span class="cake-side right"><img src="https://mjf370.github.io/m7_dog.png" style="width:60px;height:60px;border-radius:14px;background:#fff;padding:3px;box-shadow:0 3px 8px rgba(0,0,0,.15)"></span>
    <span class="cake-side bottom-l float-fast"><img src="https://mjf370.github.io/m3_grandpa.png" style="width:50px;height:50px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 3px 8px rgba(0,0,0,.15)"></span>
    <span class="cake-side bottom-r float-fast"><img src="https://mjf370.github.io/m4_grandma.png" style="width:50px;height:50px;border-radius:12px;background:#fff;padding:3px;box-shadow:0 3px 8px rgba(0,0,0,.15)"></span>
  </div>
  <div class="birthday-text" id="birthdayText">祝你生日快乐</div>
  <div class="birthday-subtitle" id="birthdaySubtitle">🎈 愿你每一天都闪闪发光 🎈</div>
  <div class="celebration" id="celebration"></div>
</div>
<script>
function parseConfig(){
  const hash=location.hash.replace(/^#/,'');
  if(!hash){showError('链接配置缺失，请联系活动主办方');return null}
  try{
    let b64=hash;
    if(hash.startsWith('wheel='))b64=hash.slice(6);
    b64=b64.replace(/-/g,'+').replace(/_/g,'/');
    const padded=b64+'='.repeat((4-b64.length%4)%4);
    const json=decodeURIComponent(escape(atob(padded)));
    const config=JSON.parse(json);
    if(!config.v||!config.s){showError('链接配置无效');return null}
    // 简单 hash 校验（防本地篡改）
    const checkObj={v:config.v,w:config.w,p:config.p,t:config.t};
    const checkStr=JSON.stringify(checkObj);
    let h=0;
    for(let i=0;i<checkStr.length;i++){h=((h<<5)-h)+checkStr.charCodeAt(i);h|=0}
    if(h.toString(36)!==config.s){showError('链接已被篡改，请通过官方渠道获取');return null}
    return config;
  }catch(e){showError('链接配置解析失败');return null}
}
function showError(msg){
  const div=document.createElement('div');
  div.className='error-tip';
  div.textContent=msg;
  document.body.appendChild(div);
}
const CONFIG=parseConfig();
if(CONFIG){
  document.getElementById('welcomeLine1').textContent='欢迎来到'+(CONFIG.w||'寿星')+'的';
  document.getElementById('welcomeLine2').textContent='幸运大抽奖';
  if(CONFIG.t)document.getElementById('birthdayText').textContent=CONFIG.t;
  if(CONFIG.st)document.getElementById('birthdaySubtitle').textContent=CONFIG.st;
  const prizes=CONFIG.p||[];
  // 屏1 欢迎动画
  setTimeout(()=>{document.getElementById('welcomeLine1').classList.add('show');launchFireworks()},300);
  setTimeout(()=>{document.getElementById('welcomeLine2').classList.add('show')},1200);
  setTimeout(()=>{document.getElementById('btn1').classList.add('show')},2800);
  function launchFireworks(){
    const fw=document.getElementById('fireworks');
    const colors=['#ff6b9d','#ffa502','#2ed573','#1e90ff','#c780ff','#ff4757','#fff200'];
    for(let i=0;i<60;i++){
      setTimeout(()=>{
        const spark=document.createElement('div');
        spark.className='spark';
        spark.style.left=Math.random()*100+'%';
        spark.style.top=Math.random()*100+'%';
        const color=colors[Math.floor(Math.random()*colors.length)];
        spark.style.background=color;
        spark.style.boxShadow='0 0 10px '+color;
        spark.style.setProperty('--tx',(Math.random()-.5)*200+'px');
        spark.style.setProperty('--ty',(Math.random()-.5)*200+'px');
        fw.appendChild(spark);
        setTimeout(()=>spark.remove(),1600);
      },i*30);
    }
  }
  // 樱花飘落（全局）
  function initSakura(id){
    const layer=document.getElementById(id);
    if(!layer)return;
    layer.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden';
    const flowers=['🌸','🌼','🌺','💮'];
    for(let i=0;i<14;i++){
      const s=document.createElement('span');
      s.className='sakura';
      s.textContent=flowers[Math.floor(Math.random()*flowers.length)];
      s.style.left=Math.random()*100+'%';
      const dur=8+Math.random()*6;
      s.style.animationDuration=dur+'s';
      s.style.animationDelay=(-Math.random()*dur)+'s';
      s.style.fontSize=(14+Math.random()*10)+'px';
      layer.appendChild(s);
    }
  }
  initSakura('sakuraLayer1');
  initSakura('sakuraLayer2');
  initSakura('sakuraLayer3');
  initSakura('sakuraLayer4');
  // 屏3 转盘绘制
  const canvas=document.getElementById('wheel');
  const ctx=canvas.getContext('2d');
  const SIZE=640,CENTER=320,RADIUS=310;
  const COLORS=['#ff6b9d','#ffa07a','#ffd93d','#6bcf7f','#4d96ff','#c780ff','#ff4757','#00d2d3'];
  function drawWheel(){
    const n=prizes.length;
    if(n===0){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CENTER,CENTER,RADIUS,0,Math.PI*2);ctx.fill();ctx.fillStyle='#999';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('未配置奖品',CENTER,CENTER);return}
    const arc=(Math.PI*2)/n;
    for(let i=0;i<n;i++){
      const start=i*arc-Math.PI/2;
      const end=start+arc;
      ctx.fillStyle=prizes[i].color||COLORS[i%COLORS.length];
      ctx.beginPath();ctx.moveTo(CENTER,CENTER);ctx.arc(CENTER,CENTER,RADIUS,start,end);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
      ctx.save();ctx.translate(CENTER,CENTER);ctx.rotate(start+arc/2);
      ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';
      ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=4;
      const name=prizes[i].name||('奖项'+(i+1));
      const display=name.length>6?name.slice(0,6)+'..':name;
      ctx.fillText(display,RADIUS-30,10);
      ctx.restore();
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CENTER,CENTER,50,0,Math.PI*2);ctx.fill();
  }
  drawWheel();
  // 转盘旋转
  let spinning=false,spunIndex=-1,extraChances=0,currentRotation=0;
  const MAX_EXTRA=2;  // 最多再抽2次（首抽+红包+1=最多3次）
  const spinBtn=document.getElementById('spinBtn');
  const spinLabel=document.getElementById('spinLabel');
  function setSpinLabel(html){spinLabel.innerHTML=html}
  spinBtn.addEventListener('click',()=>{
    if(spinning)return;
    if(spunIndex>=0){showPrizeModal(spunIndex);return}
    if(prizes.length===0){showError('未配置奖品');return}
    spinning=true;
    spinBtn.classList.add('disabled');
    setSpinLabel('抽奖<br>中..');
    spunIndex=Math.floor(Math.random()*prizes.length);
    const n=prizes.length;
    const arc=360/n;
    const targetCenter=-90+(spunIndex+.5)*arc;
    const extraSpins=5+Math.floor(Math.random()*3);
    const deltaAngle=(360-targetCenter)+extraSpins*360;
    currentRotation+=deltaAngle;          // 累加，不覆盖
    canvas.style.transform='rotate('+currentRotation+'deg)';
    setTimeout(()=>{
      spinning=false;
      const prizeName=(prizes[spunIndex].name||'').toLowerCase();
      const isRedPacket=prizeName.includes('红包')||prizeName.includes('red');
      if(!isRedPacket||extraChances>=MAX_EXTRA){spinBtn.classList.add('disabled');setSpinLabel('已<br>抽奖')}
      else{setSpinLabel('再抽<br>一次')}
      showPrizeModal(spunIndex);
    },4200);
  });
  function showPrizeModal(idx){
    const p=prizes[idx];
    const prizeName=(p.name||'').toLowerCase();
    const isRedPacket=prizeName.includes('红包')||prizeName.includes('red');
    const displayName=p.name||'神秘大奖';
    document.getElementById('prizeTitle').textContent=isRedPacket?'恭喜你抽中 '+displayName+'！再给你一次机会 🎁':'恭喜你抽中 '+displayName+'！';
    document.getElementById('prizeName').textContent=displayName;
    const imgBox=document.getElementById('prizeImg');
    if(p.img){imgBox.innerHTML='<img src="'+p.img+'" alt="'+p.name+'">'}
    else{
      const emojis=['🎁','🎀','🌸','💝','🎂','✨','🌟','🎈'];
      imgBox.innerHTML='<div class="emoji">'+emojis[idx%emojis.length]+'</div>';
    }
    document.getElementById('prizeModal').classList.add('show');
  }
  document.getElementById('closeModal').addEventListener('click',()=>{
    document.getElementById('prizeModal').classList.remove('show');
    if(spunIndex>=0){
      const pName=(prizes[spunIndex].name||'').toLowerCase();
      const isRedPacket=pName.includes('红包')||pName.includes('red');
      if(isRedPacket && extraChances<MAX_EXTRA){
        spunIndex=-1;
        extraChances++;
        spinBtn.classList.remove('disabled');
        setSpinLabel('再抽<br>一次');
      }
    }
  });
  // 屏4 音频 + 礼炮
  let audio=null,celebrationFired=false;
  function playBirthdayAudio(){
    if(CONFIG.a){
      audio=new Audio(CONFIG.a);
      audio.loop=false;
      const tryPlay=()=>{const p=audio.play();if(p)p.catch(()=>{})};
      tryPlay();
      audio.addEventListener('ended',()=>{if(!celebrationFired){celebrationFired=true;launchCelebration()}});
    }
    // 5秒后兜底触发礼炮
    setTimeout(()=>{if(!celebrationFired){celebrationFired=true;launchCelebration()}},5000);
  }
  function launchCelebration(){
    const cel=document.getElementById('celebration');
    cel.classList.add('show');
    const colors=['#ff4757','#ffa502','#2ed573','#1e90ff','#c780ff','#ff6b9d','#fff200','#00d2d3'];
    for(let i=0;i<80;i++){
      const c=document.createElement('div');
      c.className='confetti';
      c.style.left=Math.random()*100+'%';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDelay=Math.random()*2+'s';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      cel.appendChild(c);
    }
    ['left:20%','left:80%'].forEach(pos=>{
      const cannon=document.createElement('div');
      cannon.className='cannon';
      cannon.style.cssText=pos;
      cannon.textContent='🎆';
      cel.appendChild(cannon);
      setTimeout(()=>cannon.remove(),1500);
    });
    setTimeout(()=>{cel.classList.remove('show');cel.innerHTML=''},6000);
  }
  // 翻页逻辑
  function goTo(n){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen'+n).classList.add('active');
    if(n===2){
      document.querySelectorAll('#screen2 .rules-list li').forEach((li,i)=>{
        setTimeout(()=>li.classList.add('show'),200+i*200);
      });
      setTimeout(()=>document.getElementById('btn2').classList.add('show'),1200);
    }else if(n===3){
      drawWheel();
      setTimeout(()=>document.getElementById('btn3').classList.add('show'),600);
    }else if(n===4){
      playBirthdayAudio();
    }
  }
  document.getElementById('btn1').addEventListener('click',()=>goTo(2));
  document.getElementById('btn2').addEventListener('click',()=>goTo(3));
  document.getElementById('btn3').addEventListener('click',()=>goTo(4));
  // 禁止双指放大
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
}
</script>
</body>
</html>
